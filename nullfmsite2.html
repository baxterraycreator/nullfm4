<style>
  :root{
    --bg: #08090b;
    --bg2: #0e1013;
    --panel: #111418;
    --line: #21252b;
    --text: #e5e7ea;
    --dim: #6b7078;
    --cyan: #4dd9e8;
    --mag: #ff3b5c;
    --amber: #e8a63f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* full-page vintage static, sits behind everything */
  #pageStatic{
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    image-rendering: pixelated;
    filter: sepia(0.45) saturate(2) hue-rotate(75deg) contrast(1.3) brightness(0.55);
    animation: staticRoll 6.5s infinite linear, staticFlicker 2.6s infinite steps(1);
  }
  #pageScanlines{
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.45) 0px,
      rgba(0,0,0,0.45) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: multiply;
  }
  #pageVignette{
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(circle at center, transparent 35%, rgba(0,0,0,0.8) 100%);
  }
  @keyframes staticFlicker{
    0%, 96%, 100%{ filter: brightness(1); }
    97%{ filter: brightness(1.4); }
    98%{ filter: brightness(0.7); }
    99%{ filter: brightness(1.15); }
  }
  @keyframes staticRoll{
    0%{ transform: translateY(0); }
    40%{ transform: translateY(0); }
    41%{ transform: translateY(-1.5%); }
    43%{ transform: translateY(0.5%); }
    45%{ transform: translateY(0); }
    100%{ transform: translateY(0); }
  }

  header{
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    padding: 24px 40px;
  }
  .dot{
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--mag);
    box-shadow: 0 0 8px var(--mag);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity: 1; }
    50%{ opacity: 0.25; }
  }

  main{
    position: relative;
    z-index: 2;
    min-height: calc(100vh - 78px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px 80px;
  }

  .logo-wrap{
    flex-shrink: 0;
  }
  .logo-wrap img{
    display: block;
    width: 260px;
    max-width: 62vw;
    height: auto;
    filter: drop-shadow(0 6px 24px rgba(0,0,0,0.75));
  }

  /* player */
  .player{
    position: relative;
    z-index: 2;
    margin-top: 40px;
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 22px 24px;
    text-align: left;
  }
  .player-row{
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .player-info{
    flex: 1;
    min-width: 0;
  }
  .station-status{
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--dim);
    margin-bottom: 6px;
  }
  .live-dot{
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--mag);
  }
  .live-dot.buffering{ background: var(--amber); }
  .now-playing{
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bars{
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 22px;
    flex-shrink: 0;
  }
  .bars span{
    width: 3px;
    background: var(--cyan);
    opacity: 0.9;
    height: 20%;
    animation: bar 0.9s ease-in-out infinite;
  }
  .bars span:nth-child(1){ animation-delay: 0s; }
  .bars span:nth-child(2){ animation-delay: 0.15s; }
  .bars span:nth-child(3){ animation-delay: 0.3s; }
  .bars span:nth-child(4){ animation-delay: 0.1s; }
  .bars span:nth-child(5){ animation-delay: 0.25s; }
  @keyframes bar{
    0%,100%{ height: 20%; }
    50%{ height: 100%; }
  }

  .drive-frame-wrap{
    margin-top: 14px;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    background: var(--bg2);
    padding: 14px;
  }
  .drive-frame-label{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 10px;
    margin-bottom: 12px;
    font-size: 11px;
    color: var(--dim);
    border-bottom: 1px solid var(--line);
  }
  .drive-frame-label span.tname{
    color: var(--text);
    font-size: 12px;
  }
  .transport-row{
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .play-btn{
    flex-shrink: 0;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .play-btn:hover{
    border-color: var(--cyan);
    color: var(--cyan);
  }
  .scrub-wrap{
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    color: var(--dim);
    font-family: 'IBM Plex Mono', monospace;
  }
  input[type="range"]{
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 3px;
    background: var(--line);
    outline: none;
    border-radius: 2px;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance: none;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--cyan);
    cursor: pointer;
    border: none;
  }
  input[type="range"]::-moz-range-thumb{
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--cyan);
    cursor: pointer;
    border: none;
  }
  .volume-row{
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
  }
  .volume-row label{
    font-size: 10px;
    color: var(--dim);
    flex-shrink: 0;
  }
  #volume{ max-width: 90px; }

  .note{
    margin-top: 16px;
    font-size: 11px;
    color: var(--dim);
    line-height: 1.6;
  }

  /* playlist */
  .playlist-wrap{
    position: relative;
    z-index: 2;
    margin-top: 40px;
    width: 100%;
    max-width: 480px;
    text-align: left;
  }
  .playlist-head{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .playlist-head h2{
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    margin: 0;
    color: var(--text);
  }
  .shuffle-btn{
    background: none;
    border: 1px solid var(--line);
    color: var(--dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 3px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .shuffle-btn:hover{
    border-color: var(--cyan);
    color: var(--cyan);
  }
  .episode-list{
    list-style: none;
    margin: 0;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    max-height: 260px;
    overflow-y: auto;
  }
  .episode-list li{
    border-bottom: 1px solid var(--line);
  }
  .episode-list li:last-child{
    border-bottom: none;
  }
  .episode-btn{
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    border: none;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    text-align: left;
    padding: 11px 14px;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .episode-btn:hover{
    background: var(--bg2);
  }
  .episode-btn.active{
    background: var(--bg2);
    color: var(--cyan);
  }
  .episode-num{
    color: var(--dim);
    font-size: 12px;
    width: 32px;
    flex-shrink: 0;
  }
  .episode-btn.active .episode-num{
    color: var(--cyan);
  }
  .episode-name{
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .now-badge{
    font-size: 10px;
    color: var(--mag);
    flex-shrink: 0;
    letter-spacing: 0.04em;
  }

  footer{
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 20px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }

  @media (max-width: 560px){
    header{ padding: 18px 20px; }
    main{ padding: 30px 18px 60px; }
    .player{ padding: 18px; }
  }
</style>
</head>
<body>

<canvas id="pageStatic" aria-hidden="true"></canvas>
<div id="pageScanlines" aria-hidden="true"></div>
<div id="pageVignette" aria-hidden="true"></div>

<header>
  <span class="dot" aria-hidden="true"></span>
</header>

  <div class="player">
    <div class="player-row">
      <div class="player-info">
        <div class="station-status">
          <span class="live-dot" id="liveDot"></span>
          <span id="statusText">on air</span>
        </div>
        <div class="now-playing" id="nowPlaying">select an episode below</div>
      </div>
      <div class="bars" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

    <div class="drive-frame-wrap">
      <div class="drive-frame-label">
        <span id="frameLabel">nothing loaded</span>
        <span class="tname" id="frameNum"></span>
      </div>
      <div class="transport-row">
        <button class="play-btn" id="playBtn" type="button" aria-label="Play">▶</button>
        <div class="scrub-wrap">
          <span id="curTime">0:00</span>
          <input type="range" id="scrub" min="0" max="100" value="0" step="0.1">
          <span id="durTime">0:00</span>
        </div>
      </div>
      <div class="volume-row">
        <label for="volume">vol</label>
        <input type="range" id="volume" min="0" max="100" value="80" step="1">
      </div>
      <audio id="audioEl" preload="none"></audio>
    </div>

    <p class="note"></p>
  </div>

  <div class="playlist-wrap">
    <div class="playlist-head">
      <h2>archive — 17 transmissions</h2>
      <button class="shuffle-btn" id="shuffleBtn" type="button">shuffle</button>
    </div>
    <ul class="episode-list" id="episodeList"></ul>
  </div>

<footer></footer>

<script>
  const episodes = [
    { num: '01', name: 'NullFM1', id: '1_oDJ1RokVIFQx6SiBX_d3tDjflPafSq-' },
    { num: '02', name: 'NullFM2', id: '19qz6emlBRqOLX8VCBegxxP12OBgGLgBO' },
    { num: '03', name: 'NullFM3', id: '1LZA2DvnmpokcNlMtPtkE6NJKcNVVKnsx' },
    { num: '04', name: 'NullFM4', id: '1jX0LUjiSmSC3sGv85ZbXDkfgzTZc8xoL' },
    { num: '05', name: 'NullFM5', id: '1veABZAhLk4Z4dOLLja7UCKiUU3g7lTIL' },
    { num: '6.2', name: 'NullFM6.2', id: '1aXCHpWIMxwm45F8rBw178imEUqjZl_SQ' },
    { num: '07', name: 'NullFM7', id: '1DZWuGf8_KLkkKvYwXOLhuPj8ChtndO1N' },
    { num: '08', name: 'NullFM8', id: '1ONq5Qz9Ix2avoHE2xLP9XeH-Xz1P_mD7' },
    { num: '09', name: 'NullFM9', id: '1j8XMEfIelwi3NQjPx4b2rMBOoeBoW-1P' },
    { num: '10', name: 'NullFM10', id: '12flHLd6P743cQXmmKgX7RskwG-LNNrOs' },
    { num: '11', name: 'NullFM11', id: '1SU2UsDsylrCnsLtPB4rkOXZa2KrJuQRc' },
    { num: '12', name: 'NullFM12', id: '1n9Ph_YUzr3zK49j7I0kDivRIEmIyWwVn' },
    { num: '13', name: 'NullFM13', id: '1mxTCVL8brPNCfoIYeSmKrzhDNmgilJNv' },
    { num: '14', name: 'NullFM14', id: '1jHEbYkMLVT3EDBdDzprrEwrkooB1XRf_' },
    { num: '15.2', name: 'NullFM15.2', id: '1rU9JTh3WlkvMCpKKNRZOmG9HIXoOpy6o' },
    { num: '16', name: 'NullFM16', id: '1wr5yYAX32NjEklrQMIIc1RaKRhX-1Bme' },
    { num: '17', name: 'NullFM17', id: '14PDuzODXuL2wAeEI0RChxxKqiMqyEe7L' }
  ];

  const DRIVE_API_KEY = 'AIzaSyAEUa2nPGiRSnAufJwJNHjQviJqzHFVvH0';

  const listEl = document.getElementById('episodeList');
  const audio = document.getElementById('audioEl');
  const frameLabel = document.getElementById('frameLabel');
  const frameNum = document.getElementById('frameNum');
  const nowPlaying = document.getElementById('nowPlaying');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const playBtn = document.getElementById('playBtn');
  const scrub = document.getElementById('scrub');
  const curTime = document.getElementById('curTime');
  const durTime = document.getElementById('durTime');
  const volume = document.getElementById('volume');
  const statusText = document.getElementById('statusText');
  const liveDot = document.getElementById('liveDot');

  audio.volume = volume.value / 100;

  episodes.forEach((ep, i) => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'episode-btn';
    btn.type = 'button';
    btn.dataset.index = i;
    btn.innerHTML =
      '<span class="episode-num">' + ep.num + '</span>' +
      '<span class="episode-name">' + ep.name + '</span>' +
      '<span class="now-badge" hidden>now</span>';
    btn.addEventListener('click', () => loadEpisode(i, true));
    li.appendChild(btn);
    listEl.appendChild(li);
  });

  function formatTime(s){
    if (!isFinite(s) || s < 0) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return m + ':' + sec;
  }

  function loadEpisode(i, autoplay){
    const ep = episodes[i];
    audio.src = 'https://www.googleapis.com/drive/v3/files/' + ep.id + '?alt=media&key=' + DRIVE_API_KEY;
    frameLabel.textContent = autoplay ? 'connecting' : 'ready';
    frameNum.textContent = 'ep ' + ep.num;
    nowPlaying.textContent = ep.name;
    statusText.textContent = autoplay ? 'connecting' : 'ready';
    liveDot.classList.add('buffering');
    scrub.value = 0;
    curTime.textContent = '0:00';
    durTime.textContent = '0:00';

    document.querySelectorAll('.episode-btn').forEach(b => {
      const active = Number(b.dataset.index) === i;
      b.classList.toggle('active', active);
      b.querySelector('.now-badge').hidden = !active;
    });

    if (autoplay){
      audio.play().catch(() => {
        frameLabel.textContent = 'tap play';
        statusText.textContent = 'tap play';
        liveDot.classList.remove('buffering');
      });
    }
  }

  playBtn.addEventListener('click', () => {
    if (!audio.src){
      loadEpisode(Math.floor(Math.random() * episodes.length), true);
      return;
    }
    if (audio.paused){
      audio.play();
    } else {
      audio.pause();
    }
  });

  audio.addEventListener('play', () => {
    playBtn.textContent = '❚❚';
    playBtn.setAttribute('aria-label', 'Pause');
  });
  audio.addEventListener('pause', () => {
    playBtn.textContent = '▶';
    playBtn.setAttribute('aria-label', 'Play');
  });
  audio.addEventListener('playing', () => {
    frameLabel.textContent = 'now playing';
    statusText.textContent = 'on air';
    liveDot.classList.remove('buffering');
  });
  audio.addEventListener('waiting', () => {
    frameLabel.textContent = 'buffering';
    statusText.textContent = 'buffering';
    liveDot.classList.add('buffering');
  });
  audio.addEventListener('error', () => {
    frameLabel.textContent = 'stream error';
    statusText.textContent = 'signal lost';
    liveDot.classList.remove('buffering');
  });
  audio.addEventListener('loadedmetadata', () => {
    durTime.textContent = formatTime(audio.duration);
    scrub.max = audio.duration || 100;
  });
  audio.addEventListener('timeupdate', () => {
    curTime.textContent = formatTime(audio.currentTime);
    if (!scrub.matches(':active')) scrub.value = audio.currentTime;
  });

  scrub.addEventListener('input', () => {
    audio.currentTime = Number(scrub.value);
  });

  volume.addEventListener('input', () => {
    audio.volume = volume.value / 100;
  });

  shuffleBtn.addEventListener('click', () => {
    const i = Math.floor(Math.random() * episodes.length);
    loadEpisode(i, true);
  });

  loadEpisode(Math.floor(Math.random() * episodes.length), false);
  const pageStatic = document.getElementById('pageStatic');
  const sctx = pageStatic.getContext('2d');
  const RES_W = 96;
  const RES_H = 64;
  pageStatic.width = RES_W;
  pageStatic.height = RES_H;
  const frameData = sctx.createImageData(RES_W, RES_H);

  function drawStatic(){
    const d = frameData.data;
    for (let y = 0; y < RES_H; y++){
      const rowStreak = Math.random() < 0.05 ? (150 + Math.random() * 105) : null;
      for (let x = 0; x < RES_W; x++){
        const idx = (y * RES_W + x) * 4;
        const v = rowStreak !== null ? rowStreak : Math.random() * 255;
        d[idx] = v; d[idx+1] = v; d[idx+2] = v; d[idx+3] = 255;
      }
    }
    sctx.putImageData(frameData, 0, 0);
  }

  function resizeStatic(){
    pageStatic.style.width = window.innerWidth + 'px';
    pageStatic.style.height = window.innerHeight + 'px';
  }
  resizeStatic();
  window.addEventListener('resize', resizeStatic);

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (prefersReducedMotion){
    drawStatic();
  } else {
    setInterval(drawStatic, 70);
  }
</script>
